name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build & zip
        run: npx wxt build && npx wxt zip

      - name: Upload zip to release
        uses: softprops/action-gh-release@v2
        with:
          files: .output/*.zip
