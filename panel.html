<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gladium AI Panel</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <main class="panel-root">
      <header class="panel-toolbar">
        <div class="toolbar-title">
          <p class="eyebrow">Gladium AI</p>
          <h1>Network Snapshot</h1>
        </div>
        <div class="toolbar-actions">
          <button id="snapshot-toggle" class="snapshot-button" type="button">
            Take Snapshot
          </button>
          <button id="snapshot-export" class="export-button" type="button" disabled>
            Export JSON
          </button>
          <p id="live-indicator" class="live-indicator" aria-live="polite">
            Live updates enabled
          </p>
        </div>
      </header>

      <section class="panel-grid" aria-label="Network requests">
        <article class="pane list-pane" aria-label="Recorded requests list">
          <header class="pane-header">
            <h2>Captured Requests</h2>
            <span id="request-count" class="count-pill">0</span>
            <span id="endpoint-count" class="count-pill endpoint-pill" title="Unique endpoints">0 endpoints</span>
          </header>
          <div id="request-list" class="request-list" role="listbox" aria-label="Recorded requests"></div>
        </article>

        <article class="pane detail-pane" aria-label="Snapshot details">
          <section class="detail-block" aria-label="Request details">
            <header class="pane-header">
              <h2>Request Details</h2>
            </header>
            <div id="request-details" class="request-details"></div>
          </section>

          <section class="detail-block cookie-block" aria-label="Snapshot cookies">
            <header class="pane-header">
              <h2>Snapshot Cookies</h2>
              <span id="cookie-count" class="count-pill">0</span>
            </header>
            <div id="cookie-list" class="cookie-list"></div>
          </section>
        </article>
      </section>
    </main>

    <script src="request-recorder.js"></script>
    <script src="url-normalizer.js"></script>
    <script src="schema-inferrer.js"></script>
    <script src="panel.js"></script>
  </body>
</html>
